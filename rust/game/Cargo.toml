[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
render   = { path = "../render" }
sim      = { path = "../sim" }
assets   = { path = "../assets" }
sim-core = { path = "../sim-core" }
scenario = { path = "../scenario" }

# --- Base Bevy features (shared native + wasm): the 3c draw set --------------------
# In Bevy 0.19 the render stack is split OUT of `bevy_sprite`: the plain
# `bevy_sprite` feature only pulls the sprite *logic* crate (+ bevy_camera) and
# brings in NO GPU backend (no bevy_render, no bevy_core_pipeline, no wgpu/naga).
# These six are the platform-agnostic set both native and the browser draw with;
# the per-target backend/windowing features union onto them via the target tables
# below (standard cargo: features union across repeated deps for one package).
bevy = { version = "0.19", default-features = false, features = [
    "bevy_render",         # wgpu/naga GPU backend + RenderPlugin (the actual device)
    "bevy_core_pipeline",  # Camera2d + 2D render graph + clear-color (pulls bevy_render)
    "bevy_sprite_render",  # SpriteRenderPlugin — draws Sprite entities on the GPU
                           #   (transitively pulls bevy_core_pipeline + bevy_sprite)
    "bevy_sprite",   # sprite components / Image type (logic only; no GPU on its own)
    "bevy_winit",    # window + event loop (winit drives the browser canvas on wasm)
    "bevy_window",
] }

# --- Native-only windowing (Slice 3f) ---------------------------------------------
# X11/Wayland are Linux window backends (inert on macOS, required on Linux/CI).
# `wayland-sys` resolves via pkg-config AT BUILD TIME, so it must NEVER reach the
# wasm target — hence this non-wasm target table (they'd break the wasm build).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["x11", "wayland"] }
# Audio backend (Slice 4c, T3), native-only — the wasm sink is T5. `Sink`/
# `OutputStream`/`SamplesBuffer` are plain (non-optional) deps of `cpal` in
# this rodio line, not feature-gated, so `default-features = false` alone
# drops every format decoder (flac/vorbis/wav/mp3) we don't need: WAV bytes
# are already decoded by `assets::wav` and handed to `SamplesBuffer<i16>`
# directly (design §5). Pinned to 0.19 (not the newest 0.22) because 0.19 has
# the classic `Sink`/`OutputStream` API the design is written against; 0.22
# renamed these to `Player`/`DeviceSinkBuilder` — a real API, just a later
# one the design predates. Contained behind the `AudioSink` seam, so a future
# bump only touches this file.
rodio = { version = "0.19", default-features = false }

# --- Wasm-only backend (Slice 3f) -------------------------------------------------
# WebGL2 is Bevy 0.19's default web backend (broadest browser reach; the CPU-blit
# renderer is trivially within it). NEVER `webgpu` — it OVERRIDES webgl2 and drops
# non-WebGPU browsers. NEVER `x11`/`wayland` here (they do not build for wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["webgl2"] }
# Wasm audio backend (Slice 4c, T5). Same `rodio` line as the native table
# (design §5's "swappable seam"), plus the `wasm-bindgen` feature: it flips
# on `cpal`'s optional `wasm-bindgen` dep, which is the exact `cfg` cpal's
# `platform/mod.rs` gates its WebAudio host behind
# (`cfg(all(target_arch = "wasm32", feature = "wasm-bindgen"))`, checked
# against cpal 0.15.3 source) — without it cpal compiles a host with zero
# devices on wasm32 and `RodioSink::try_new` would always `Err`. cpal's
# WebAudio backend builds an `AudioContext` synchronously (no
# `wasm-bindgen-futures` needed); `Sink`/`Stream::play()` calls
# `AudioContext::resume()`, which the browser's autoplay policy holds
# `suspended` until a user gesture — no error, just silence until then (T5
# task note; documented on `build_native_sink`'s wasm branch below).
rodio = { version = "0.19", default-features = false, features = ["wasm-bindgen"] }
# PR-preview build: read the page URL's query string (`web_params`) and log
# ignored parameters to the browser console. Already in the tree via Bevy/winit.
web-sys = { version = "0.3", features = ["Window", "Location", "console"] }

# Dev-only fast-iteration linking. NEVER a default; never enabled in CI; NEVER with
# the wasm target (`dynamic_linking` cannot build for wasm32).
[features]
dynamic = ["bevy/dynamic_linking"]
